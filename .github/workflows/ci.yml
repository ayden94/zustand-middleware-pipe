name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Zustand ${{ matrix.zustand }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        zustand: [locked, '5.0.8']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install minimum supported Zustand
        if: matrix.zustand != 'locked'
        run: npm install --no-save zustand@${{ matrix.zustand }}

      - name: Run verification
        run: npm run verify
