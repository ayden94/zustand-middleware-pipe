name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Zustand ${{ matrix.zustand }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        zustand: [locked, '5.0.8']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install minimum supported Zustand
        if: matrix.zustand != 'locked'
        run: npm install --no-save zustand@${{ matrix.zustand }}

      - name: Run verification
        run: npm run verify

  example:
    name: Example build and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/package-lock.json

      - name: Install and build the library
        run: npm ci && npm run build

      - name: Install the example reproducibly
        run: npm ci --prefix examples --install-links

      - name: Build and lint the example
        run: npm run build --prefix examples && npm run lint --prefix examples
